name: Build SHIFT Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      # Keep the same debug signing certificate across builds so Android can update
      # previously installed builds signed by this workflow (cache may expire).
      - name: Restore Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shift-debug-signing-v1
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SHIFT-Neon-Logic-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
