name: Build SHIFT Android APK
on:
  push:
    branches: [main, test-porte-livello-41]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      # Keep the same debug signing certificate across builds so Android can update
      # previously installed builds signed by this workflow (cache may expire).
      - name: Restore Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shift-debug-signing-v1
      - name: Validate game JavaScript and required UI
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set()
              def handle_starttag(self, tag, attrs):
                  for key,value in attrs:
                      if key=='id':
                          assert value not in self.ids, f'Duplicate id: {value}'
                          self.ids.add(value)
          src=Path('app/src/main/assets/index.html').read_text()
          audit=Audit();audit.feed(src)
          required={'board','helpModal','featureModal','exitModal','exitTop','achieveModal','dailyClaim','skipIntro'}
          assert required<=audit.ids, f'Missing UI: {required-audit.ids}'
          js=src.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/shift-game.js').write_text(js)
          print('HTML IDs and game controls OK')
          PY
          node --check /tmp/shift-game.js
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SHIFT-Porte-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
